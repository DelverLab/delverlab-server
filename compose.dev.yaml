name: delverlab-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: delverlab
      POSTGRES_USER: delverlab
      POSTGRES_PASSWORD: delverlab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delverlab -d delverlab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
