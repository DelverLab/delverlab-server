services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: delverlab
      POSTGRES_USER: delverlab
      POSTGRES_PASSWORD: delverlab
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delverlab -d delverlab"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    image: ${DELVERLAB_CI_IMAGE:?Set by build-image.sh}
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/delverlab
      SPRING_DATASOURCE_USERNAME: delverlab
      SPRING_DATASOURCE_PASSWORD: delverlab